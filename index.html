
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .error {
            padding: 30px;
        }

        h1 {
            font-size: 64px;
            margin: 0;
            color: #e74c3c;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="error">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            This page doesn't exist or cannot be accessed directly.
            Please check that you have the correct link.
        </p>
    </div>
</body>
</html>
